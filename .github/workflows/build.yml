name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:


jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [ arm64 ]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: gh-cache/
          key: "prefix-${{ hashFiles('buildscripts/**.sh') }}"
          restore-keys: "prefix-"
          enableCrossOsArchive: true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkg-config pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson


      - name: Download deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build the release artifacts
        run: |
          set -x -o pipefail
          unset ANDROID_SDK_ROOT
          cd buildscripts
          ./download.sh > /dev/null
          (
            ./buildall.sh --arch ${{ matrix.architecture }} mpv
            ./buildall.sh -n
          ) 2>&1 | tee "../build-${{ matrix.architecture }}.log"

      # Jobs logs need a token to download; a release asset does not.
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l build-*.log || true
          gh release view ci-logs >/dev/null 2>&1 || \
            gh release create ci-logs --title "CI logs" --notes "build logs" --latest=false
          cp "build-${{ matrix.architecture }}.log" "build-log-${{ matrix.architecture }}.log" 2>/dev/null || true
          gh release upload ci-logs "build-log-${{ matrix.architecture }}.log" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-lib-${{ matrix.architecture }}
          path: app/build/outputs/aar/app-release.aar

      # Artifacts need a token to download; release assets do not.
      - name: Publish arm64 AAR as release asset
        if: matrix.architecture == 'arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view hdr-4.5.0 >/dev/null 2>&1 || \
            gh release create hdr-4.5.0 --title "HDR AAR (aligned to v0.0.9 / REX 4.5.0)" \
              --notes "libmpv built from v0.0.9 + mpv-hdr-output.patch" --latest=false
          gh release upload hdr-4.5.0 \
            app/build/outputs/aar/app-release.aar#mpvRex-libmpv-arm64.aar --clobber
